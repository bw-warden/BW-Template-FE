services:
  app:
    build: .
    container_name: bw-frontend
    ports:
      - "3000:3000"
    environment:
      APP_SECRET: ${APP_SECRET}
      NODE_ENV: production
      DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
