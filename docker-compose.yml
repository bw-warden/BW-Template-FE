services:
  redis:
    image: redis:7-alpine
    container_name: bw-template-fe-redis
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
        "--appendonly",
        "yes",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    # Not published to the host — app-only on the Compose network.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: bw-template-fe
    ports:
      - "3000:3000"
    environment:
      APP_SECRET: ${APP_SECRET}
      NODE_ENV: production
      DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
