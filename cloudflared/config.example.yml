# Optional Cloudflare Tunnel example — copy to config.yml and fill in your values.
# Never commit real tunnel IDs, hostnames, or credentials JSON.
#
# credentials-file should point at your mounted tunnel credentials inside the container.
# Default docker-compose.yml does not run cloudflared; add your own overlay if needed.

tunnel: YOUR_TUNNEL_ID
credentials-file: /etc/cloudflared/YOUR_TUNNEL_ID.json

ingress:
  - hostname: your.hostname.example
    service: http://app:3000
    originRequest:
      connectTimeout: 10s
  - service: http_status:404
